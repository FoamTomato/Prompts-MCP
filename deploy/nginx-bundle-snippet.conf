# nginx-bundle-snippet.conf
#
# Append into the same `server { server_name xiaohang.site; ... }` block as
# the existing /skills/ location. Order matters: this block must appear
# BEFORE `location /skills/` because nginx picks the longest matching prefix
# first only when there's no regex involved; with two plain prefix locations
# the longer one (/skills/bundle/) wins regardless of order — but we still
# place this above for human readability.
#
# After editing /opt/nginx/conf.d/default.conf:
#   docker compose exec nginx nginx -t
#   docker compose exec nginx nginx -s reload
#
# Reuses the same nginx container that already fronts /mcp/ and /skills/.

# Static skill bundle — published by .github/workflows/bundle.yml.
# /var/www/skills-bundle is populated atomically (release dir + symlink swap),
# so a client mid-download will either see the old file or the next request
# sees the new file — never a half-written tar.
location /skills/bundle/ {
    alias /var/www/skills-bundle/;
    autoindex off;

    # The plugin's update check is a tiny GET version.txt — cache off so
    # users see new versions immediately. tar.gz can be cached briefly;
    # bundle filename is content-addressed via sha256 in the manifest,
    # so stale tar reads will fail sha verification client-side and retry.
    location ~ \.(txt|json|sha256|SHA256SUMS)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
    }
    location ~ \.tar\.gz$ {
        add_header Cache-Control "public, max-age=300";
        add_header Access-Control-Allow-Origin "*";
    }

    # Only static GET/HEAD allowed; reject PUT/POST/etc. to make it clear
    # this isn't an upload endpoint.
    limit_except GET HEAD {
        deny all;
    }
}
