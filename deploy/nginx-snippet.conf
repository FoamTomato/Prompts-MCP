# Append inside the `server { server_name xiaohang.site; ... }` block
# of /opt/nginx/conf.d/default.conf, then `docker compose exec nginx nginx -s reload`.

# MCP HTTP/SSE entry — long-lived connections, buffering off
location /mcp/ {
    proxy_pass http://prompts-mcp:8080/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /mcp;
}

# Web viewer — static + dynamic markdown rendering
location /skills/ {
    proxy_pass http://prompts-mcp:8080/web/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /skills;
}
