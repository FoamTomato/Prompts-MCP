# Snippet to append into the `services:` block of /opt/docker-compose.yml on
# the production server. Same network (app-net → opt_app-net) and same
# `deploy.resources.limits` style as the rest of the file.
#
# Image is built and published by .github/workflows/docker.yml on every push
# to main → ghcr.io/foamtomato/prompts-mcp:latest. The server only pulls.
#
# Apply with:
#   cd /opt && docker compose pull prompts-mcp && docker compose up -d prompts-mcp
#   docker compose exec nginx nginx -s reload   # AFTER applying nginx-snippet.conf

  prompts-mcp:
    image: ghcr.io/foamtomato/prompts-mcp:latest
    container_name: prompts-mcp
    restart: always
    expose:
      - "8080"
    environment:
      - SKILLS_ROOT=/app/skills
      - PORT=8080
      - LOG_LEVEL=INFO
    volumes:
      - /opt/prompts-mcp/skills:/app/skills:ro
    networks:
      - app-net
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: 192M
        reservations:
          memory: 64M
