# Snippet to append into the `services:` block of /opt/docker-compose.yml on
# the production server. Same network (app-net → opt_app-net) and same
# `deploy.resources.limits` style as the rest of the file.
#
# IMAGE SOURCE — pulled from a GHCR mirror (南京大学开源镜像站) because
# direct ghcr.io pulls from this server's CN egress are very slow / unreliable.
# Both ghcr.nju.edu.cn and ghcr.mirrorify.net mirror github.com/foamtomato/
# prompts-mcp/pkgs/container — switch hosts in this line if one is down.
# Pull time observed: ~40s vs. >10min for direct ghcr.io.
#
# Fallback path (zero external dependency): build locally + scp + docker load.
# See scripts/deploy_image.sh — useful when both mirrors are down.
#
# Apply with:
#   cd /opt && docker compose pull prompts-mcp && docker compose up -d prompts-mcp

  prompts-mcp:
    image: ghcr.nju.edu.cn/foamtomato/prompts-mcp:latest
    container_name: prompts-mcp
    restart: always
    expose:
      - "8080"
    environment:
      - SKILLS_ROOT=/app/skills
      - PORT=8080
      - LOG_LEVEL=INFO
    volumes:
      - /opt/prompts-mcp/skills:/app/skills:ro
    networks:
      - app-net
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: 192M
        reservations:
          memory: 64M
