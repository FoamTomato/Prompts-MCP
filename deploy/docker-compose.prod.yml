# Snippet to append into the `services:` block of /opt/docker-compose.yml on
# the production server. Uses the same network (`app-net` → opt_app-net) and
# the same `deploy.resources.limits` style as the existing services there.
#
# After appending:
#   cd /opt && docker compose up -d --build prompts-mcp
#   docker compose exec nginx nginx -s reload   # AFTER applying nginx-snippet.conf

  prompts-mcp:
    build: /opt/prompts-mcp
    image: prompts-mcp:latest
    container_name: prompts-mcp
    restart: always
    expose:
      - "8080"
    environment:
      - SKILLS_ROOT=/app/skills
      - PORT=8080
      - LOG_LEVEL=INFO
    volumes:
      - /opt/prompts-mcp/skills:/app/skills:ro
    networks:
      - app-net
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: 192M
        reservations:
          memory: 64M
