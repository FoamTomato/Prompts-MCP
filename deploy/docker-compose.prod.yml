# Snippet to append into /opt/docker-compose.yml on the production server.
# Assumes the existing `app-net` network defined by the main compose file.
#
# After appending:
#   cd /opt && docker compose up -d --build prompts-mcp
#   docker compose exec nginx nginx -s reload

services:
  prompts-mcp:
    build: /opt/prompts-mcp
    container_name: prompts-mcp
    restart: unless-stopped
    mem_limit: 128m
    environment:
      SKILLS_ROOT: /app/skills
      PORT: "8080"
      BASE_URL_PREFIX: /mcp
      LOG_LEVEL: INFO
    volumes:
      - /opt/prompts-mcp/skills:/app/skills:ro
    networks:
      - app-net
