name: Build and deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push to GHCR
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Strategy: build pushes to ghcr.io.  Deploy SSHes into the prod server
    # and tells it to pull from ghcr.nju.edu.cn (CN mirror) — *not* through
    # the Actions runner network, which has unstable cross-border throughput
    # to CN ingress.  This way the heavy 197MB image transit happens on the
    # path with the best throughput in practice (GHCR → CN mirror → server).
    needs: build
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    environment:
      name: production
      url: https://xiaohang.site/skills/
    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ] || [ -z "${SSH_HOST:-}" ]; then
            echo "::warning::PROD_SSH_KEY or PROD_SSH_HOST not set — skipping deploy."
            echo "skip_deploy=1" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          {
            printf '%s' "$SSH_KEY"
            [ "$(printf '%s' "$SSH_KEY" | tail -c1 | od -An -c | tr -d ' ')" = "\\n" ] || printf '\n'
          } > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if ! ssh-keygen -y -f ~/.ssh/id_deploy > ~/.ssh/id_deploy.pub 2>/tmp/keygen.err; then
            echo "::error::PROD_SSH_KEY did not parse"
            cat /tmp/keygen.err
            exit 1
          fi
          echo "Key parses. Fingerprint:"
          ssh-keygen -lf ~/.ssh/id_deploy.pub
          ssh-keyscan -t ed25519,rsa "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<EOF
          Host prod
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            ServerAliveInterval 30
            ServerAliveCountMax 3
          EOF

      - name: Pull from mirror + restart
        if: env.skip_deploy != '1'
        # Server-side pulls the freshly-built image from a CN GHCR mirror.
        # GHCR is unreachable directly from CN egress (>10min / EOF), but
        # mirrors (nju, mirrorify) work — though intermittently. So we do:
        #   - 2 mirrors × 3 attempts each = up to 6 tries
        #   - per-attempt timeout 300s (typical successful cold pull is ~40s)
        #   - explicit cleanup of half-pulled layers between attempts to avoid
        #     docker reusing a broken layer cache after an EOF
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          ssh -o BatchMode=yes prod 'bash -se' <<EOF
            set -euo pipefail
            cd /opt

            digest="${DIGEST}"
            pulled=""
            for mirror in ghcr.nju.edu.cn ghcr.mirrorify.net; do
              image="\$mirror/foamtomato/prompts-mcp:latest"
              # Always start each mirror with no cached image for it — a prior
              # partial pull can leave a stale manifest that docker happily reuses.
              docker rmi "\$image" 2>/dev/null || true
              for attempt in 1 2 3; do
                echo "::group::Mirror \$mirror attempt \$attempt"
                if timeout 300 docker pull "\$image"; then
                  docker tag "\$image" prompts-mcp:latest
                  pulled="\$mirror"
                  echo "::endgroup::"
                  break 2
                fi
                echo "attempt \$attempt failed"
                # Don't leave a half-pulled image around for the next try
                docker rmi "\$image" 2>/dev/null || true
                # Slight backoff between attempts (kernel TCP keepalive etc.)
                sleep 5
                echo "::endgroup::"
              done
            done
            if [ -z "\$pulled" ]; then
              echo "::error::All mirrors failed after 2×3 attempts. Run scripts/deploy_image.sh locally (see deploy/README.md)."
              exit 1
            fi
            echo "Pulled from: \$pulled"

            # Compose may still reference an old mirror image — rewrite to
            # plain local tag so future restarts don't re-pull.
            if grep -q "image: ghcr" docker-compose.yml; then
              cp docker-compose.yml "docker-compose.yml.bak.\$(date +%Y%m%d-%H%M%S)"
              sed -i 's|image: ghcr[^[:space:]]*prompts-mcp:latest|image: prompts-mcp:latest|g' docker-compose.yml
            fi

            docker compose up -d --force-recreate prompts-mcp
            sleep 5
            docker compose ps prompts-mcp

            # Health probe from inside the container — independent of nginx.
            docker exec prompts-mcp python -c "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8080/health',timeout=5); print(r.read().decode()); sys.exit(0 if r.status==200 else 1)"
          EOF

      - name: Verify external endpoint
        if: env.skip_deploy != '1'
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS "https://xiaohang.site/mcp/health" >/dev/null; then
              echo "External health OK"
              curl -fsS "https://xiaohang.site/mcp/health"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 4
          done
          echo "::error::External /mcp/health never came up"
          exit 1
