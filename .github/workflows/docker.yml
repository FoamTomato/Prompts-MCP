name: Build and deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Build twice (linked by cache so it's cheap): once to GHCR for the
      # mirror/archive path, once into a local tar that we'll scp to the
      # production server.  Keeping the GHCR push means anyone with
      # internet can still `docker pull` it from a non-CN host.
      - name: Build and push to GHCR
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image to tar
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: prompts-mcp:latest
          outputs: type=docker,dest=/tmp/prompts-mcp.tar
          cache-from: type=gha

      - name: Upload tar as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-tar
          path: /tmp/prompts-mcp.tar
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Run deploy on push to main AND on manual workflow_dispatch (so we can
    # retrigger after secrets are added without an empty commit). Inner
    # steps still no-op when secrets are missing.
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    environment:
      name: production
      url: https://xiaohang.site/skills/
    steps:
      - name: Download image tar
        uses: actions/download-artifact@v4
        with:
          name: image-tar
          path: /tmp

      - name: Set up SSH
        # Loads PROD_SSH_KEY into a file. Two writes are tried so we tolerate
        # both "secret has trailing newline" and "secret stripped trailing
        # newline" cases — the second form would otherwise break ed25519 key
        # parsing with `error in libcrypto`. Verifies the key actually parses
        # before continuing.
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ] || [ -z "${SSH_HOST:-}" ]; then
            echo "::warning::PROD_SSH_KEY or PROD_SSH_HOST not set — skipping deploy."
            echo "skip_deploy=1" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write key. printf %s avoids printf's interpretation of \n inside
          # the secret, then we ensure there's exactly one trailing newline.
          {
            printf '%s' "$SSH_KEY"
            # add a trailing newline only if the secret didn't already end with one
            [ "$(printf '%s' "$SSH_KEY" | tail -c1 | od -An -c | tr -d ' ')" = "\\n" ] || printf '\n'
          } > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Verify the key actually parses. If it doesn't, ssh-keygen prints
          # the real reason (wrong format / corrupted / wrong key type).
          if ! ssh-keygen -y -f ~/.ssh/id_deploy > ~/.ssh/id_deploy.pub 2>/tmp/keygen.err; then
            echo "::error::PROD_SSH_KEY did not parse — check the secret has the full key including header/footer and unmodified newlines."
            cat /tmp/keygen.err
            exit 1
          fi
          echo "Key parses. Fingerprint:"
          ssh-keygen -lf ~/.ssh/id_deploy.pub

          # Trust the host key for the prod server (ed25519 + rsa).
          ssh-keyscan -t ed25519,rsa "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          cat >> ~/.ssh/config <<EOF
          Host prod
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            ServerAliveInterval 30
            ServerAliveCountMax 3
          EOF

      - name: scp image tar to server
        if: env.skip_deploy != '1'
        run: |
          scp -o BatchMode=yes /tmp/prompts-mcp.tar prod:/tmp/prompts-mcp.tar
          echo "Uploaded $(ls -lh /tmp/prompts-mcp.tar | awk '{print $5}')"

      - name: Load image + restart container
        if: env.skip_deploy != '1'
        run: |
          ssh -o BatchMode=yes prod 'bash -se' <<'EOF'
            set -euo pipefail
            cd /opt
            docker load -i /tmp/prompts-mcp.tar | tail -2
            # Make sure compose references the local tag, not a ghcr.io one
            # (idempotent — sed only rewrites if a ghcr.* line is present).
            if grep -q "image: ghcr" docker-compose.yml; then
              cp docker-compose.yml "docker-compose.yml.bak.$(date +%Y%m%d-%H%M%S)"
              sed -i 's|image: ghcr[^[:space:]]*prompts-mcp:latest|image: prompts-mcp:latest|g' docker-compose.yml
            fi
            docker compose up -d --force-recreate prompts-mcp
            sleep 5
            docker compose ps prompts-mcp
            # Health probe — use the container's internal port so we don't
            # depend on nginx config being intact.
            docker exec prompts-mcp python -c "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8080/health',timeout=5); print(r.read().decode()); sys.exit(0 if r.status==200 else 1)"
            # Tidy up the tar (197MB)
            rm -f /tmp/prompts-mcp.tar
          EOF

      - name: Verify external endpoint
        if: env.skip_deploy != '1'
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS "https://xiaohang.site/mcp/health" >/dev/null; then
              echo "External health OK"
              curl -fsS "https://xiaohang.site/mcp/health"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 4
          done
          echo "::error::External /mcp/health never came up"
          exit 1
