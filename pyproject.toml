[project]
name = "prompts-mcp"
version = "0.1.0"
description = "Markdown skill library exposed as a remote MCP server with web viewer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "FoamTomato" }]
dependencies = [
    "mcp>=1.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pyyaml>=6.0.2",
    "jinja2>=3.1.4",
    "markdown-it-py>=3.0.0",
    "rapidfuzz>=3.10.0",
    "pydantic>=2.9.0",
    "sse-starlette>=2.1.3",
    "pygments>=2.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[project.scripts]
prompts-mcp = "prompts_mcp.server:cli"
prompts-mcp-lint = "scripts.lint_skills:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prompts_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
